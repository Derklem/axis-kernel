[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agenda"
version = "0.1.0"
description = "Axis Planner and Agenda Engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "jsonschema>=4.19.0",
    "laboratory>=0.2.1,<0.3.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agenda = ["schemas/*.json"]

